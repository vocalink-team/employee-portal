<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js; style-src 'self' 'sha256-GefGfZ30UIN7HL/JGL/d2aeI3DdhcSIF7SEssaHNrzg='; connect-src 'self' https://cmlafkiwveixvrctnnlx.supabase.co; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="version" content="0.1.10">
<meta name="robots" content="noindex, nofollow">
<title>従業員ポータル | VOCALINK-TEAM</title>
<link rel="stylesheet" href="vl-ui.css?v=0.1.7">
<link rel="stylesheet" href="roles.css?v=0.1.5">
<link rel="stylesheet" href="announcements.css?v=0.1.5">
<link rel="stylesheet" href="owner-expenses.css?v=0.1.9">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{width:min(100% - 36px,860px);margin-inline:auto}header nav,.session{display:flex;align-items:center;justify-content:space-between;gap:12px}main{padding-block:12px 64px}h1{font-size:clamp(26px,5vw,40px);margin-block:0 18px}h2{font-size:22px;margin-block:0 14px}
section+section{margin-top:32px;padding-top:26px;border-top:1px solid #b99a89}section p{margin-block:4px 14px}.account{font-size:14px;overflow-wrap:anywhere}label{display:block;font-size:14px;font-weight:650;margin-bottom:4px}
form{display:grid;gap:14px;max-width:680px}.login-form{max-width:390px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}
input,select,textarea,button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b99a89}input,select,textarea{width:100%;min-width:0}textarea{resize:vertical;min-height:90px}button{cursor:pointer;border-radius:12px;background:#fffaf6;color:#251713}button[disabled]{cursor:default;opacity:.6}form button{justify-self:start;padding-inline:22px}
#portal-status,#submit-status,#history-status{min-height:1.5em;font-size:14px;margin-block:10px}nav a,#expense-application a{color:inherit;text-underline-offset:4px}#expense-application a{display:inline-flex;align-items:center;min-height:44px}
#history-list{list-style:none;padding:0;margin:0}#history-list li{padding-block:13px;border-bottom:1px solid #b99a89;overflow-wrap:anywhere}#history-list li:last-child{border-bottom:none}[hidden]{display:none!important}
@media(max-width:560px){.fields{grid-template-columns:1fr}.session{align-items:flex-start}header nav{min-height:0}}
</style><meta name="referrer" content="strict-origin-when-cross-origin"></head>
<body class="vl-ui">
<header><div class="wrap"><nav class="portal-header" aria-label="従業員ポータル"><a class="logo" href="./">vocalink<span>-team</span></a><small class="portal-version" aria-label="バージョン 0.1.10">v0.1.10</small></nav></div></header>
<main class="wrap">
<h1>従業員ポータル</h1>
<p id="portal-status" role="status">ログイン状態を確認しています。</p>
<section id="login" hidden>
<h2>ログイン</h2>
<form id="login-form" class="login-form">
<div><label for="email">メールアドレス</label><input type="email" id="email" name="email" autocomplete="username" required></div>
<div><label for="password">パスワード</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
<button type="submit">ログイン</button>
</form>
<details>
<summary>パスワードを忘れた場合</summary>
<p>ポータルのOwnerに再設定リンクの発行を依頼してください。</p>
</details>
</section>
<section id="password-setup" aria-labelledby="password-setup-heading" hidden>
<h2 id="password-setup-heading">パスワードの初期設定</h2>
<form id="password-setup-form" class="login-form">
<div><label for="password-setup-value">新しいパスワード（12文字以上）</label><input type="password" id="password-setup-value" autocomplete="new-password" minlength="12" required></div>
<div><label for="password-setup-repeat">新しいパスワードの確認</label><input type="password" id="password-setup-repeat" autocomplete="new-password" minlength="12" required></div>
<button type="submit" id="password-setup-submit">パスワードを設定</button>
<button type="button" id="password-setup-cancel">ログイン画面へ</button>
</form>
<p id="password-setup-status" role="status"></p>
</section>
<button id="retry" type="button" hidden>接続を再確認</button>
<div id="workspace" hidden>
<div class="session"><span id="account" class="account"></span><button type="button" id="logout">ログアウト</button></div>
<p class="account" id="account-roles"></p>
<section id="member-admin" aria-labelledby="member-heading" hidden>
<h2 id="member-heading">メンバーとロールの管理</h2>
<details id="create-member-details">
<summary>アカウントを追加</summary>
<form id="create-member-form">
<div><label for="create-member-email">追加するメンバーのメールアドレス</label><input type="email" id="create-member-email" maxlength="254" required></div>
<button type="submit" id="create-member-submit">アカウントを作成</button>
</form>
<p id="create-member-status" role="status"></p>
<div id="create-member-link-panel" hidden>
<label for="create-member-link">初期設定リンク</label>
<input type="url" id="create-member-link" readonly>
<button type="button" id="create-member-copy">リンクをコピー</button>
<button type="button" id="create-member-clear">リンクを閉じる</button>
</div>
</details>
<div class="member-actions"><button type="button" id="reload-members">一覧を更新</button></div>
<p id="member-status" role="status"></p>
<form id="member-form" hidden>
<div class="fields">
<div><label for="member-select">アカウント</label><select id="member-select" required></select></div>
<div><label for="access-select">利用状態</label><select id="access-select" required>
<option value="active">利用可</option><option value="suspended">停止</option>
</select></div>
</div>
<details id="role-details"><summary>担当ロールを選ぶ</summary><div id="role-options"></div></details>
<button type="submit">変更を保存</button>
</form>
<div id="reset-member" class="member-actions" hidden>
<button type="button" id="reset-member-submit">パスワード再設定リンクを発行</button>
<p id="reset-member-status" role="status"></p>
<div id="reset-member-link-panel" hidden>
<label for="reset-member-link">再設定リンク</label>
<input type="url" id="reset-member-link" readonly>
<button type="button" id="reset-member-copy">リンクをコピー</button>
<button type="button" id="reset-member-clear">リンクを閉じる</button>
</div>
</div>
</section>
<section id="announcements" aria-labelledby="announcements-heading">
<h2 id="announcements-heading">社内向けお知らせ</h2>
<div id="announcement-admin" hidden>
<button type="button" id="announcement-new">お知らせを作成</button>
<form id="announcement-form" hidden>
<h3 id="announcement-form-heading">お知らせを作成</h3>
<div><label for="announcement-title">タイトル</label><input id="announcement-title" maxlength="120" required></div>
<div><label for="announcement-body">本文</label><textarea id="announcement-body" maxlength="6000" required></textarea></div>
<div class="announcement-actions">
<button type="submit" value="draft">下書き保存</button>
<button type="submit" value="publish">公開する</button>
<button type="button" id="announcement-cancel">閉じる</button>
</div>
</form>
</div>
<p id="announcement-status" role="status"></p>
<div id="announcement-list"></div>
<div id="announcement-pages" class="announcement-actions" hidden>
<button type="button" id="announcement-prev">前へ</button>
<button type="button" id="announcement-next">次へ</button>
</div>
</section>
<section aria-labelledby="manual-heading">
<h2 id="manual-heading">マニュアル</h2>
<p id="manual-status" role="status"></p>
<div id="expense-application" hidden>
<h3 id="expense-manual-title"></h3>
<ol id="expense-manual-steps"></ol>
<p id="expense-manual-note"></p>
<a href="#expense-heading">経費申請フォームへ</a>
</div>
</section>
<section aria-labelledby="expense-heading">
<h2 id="expense-heading">経費申請</h2>
<p>業務で立て替えた支出を申請します。領収書は指定の保存先に保管してください。</p>
<form id="expense-form">
<div class="fields">
<div class="field"><label for="spent-on">支払日</label><input type="date" id="spent-on" name="spent_on" required></div>
<div class="field"><label for="category">費目</label><select id="category" name="category" required>
<option value="">選択してください</option><option value="transport">交通費</option><option value="software">ソフトウェア・サーバー</option><option value="production">制作・外注費</option><option value="equipment">備品</option><option value="other">その他</option>
</select></div>
<div class="field"><label for="amount">支払額（円）</label><input type="number" id="amount" name="amount_yen" min="1" max="999999999" step="1" inputmode="numeric" required></div>
<div class="field"><label for="payee">支払先</label><input id="payee" name="payee" maxlength="120" required></div>
</div>
<div><label for="purpose">用途</label><textarea id="purpose" name="purpose" maxlength="500" required></textarea></div>
<div><label for="receipt">証憑のファイル名・管理番号（任意）</label><input id="receipt" name="evidence_reference" maxlength="300"></div>
<div class="announcement-actions">
<button type="submit" id="expense-submit">申請する</button>
<button type="button" id="expense-edit-cancel" hidden>修正をやめる</button>
</div>
</form>
<p id="submit-status" role="status"></p>
</section>
<section aria-labelledby="history-heading">
<h2 id="history-heading">自分の申請履歴</h2>
<p id="history-status" role="status"></p>
<ol id="history-list"></ol>
<div id="history-pages" class="announcement-actions" hidden>
<button type="button" id="history-previous">前へ</button>
<button type="button" id="history-next">次へ</button>
</div>
</section>
<section id="owner-expenses" aria-labelledby="owner-expenses-heading" hidden>
<h2 id="owner-expenses-heading">経費申請一覧</h2>
<button type="button" id="refresh-owner-expenses">一覧を更新</button>
<p id="owner-expense-status" role="status"></p>
<ol id="owner-expense-list"></ol>
<div id="owner-expense-pages" class="announcement-actions" hidden>
<button type="button" id="owner-expense-previous">前へ</button>
<button type="button" id="owner-expense-next">次へ</button>
</div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script type="module" src="employee-portal.js?v=0.1.10"></script>
</body></html>
